
name: newsdrop

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: newsdrop-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/app:/app/server/app
    # command: ["python", "run.py"]

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: newsdrop-client
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
    depends_on:
      - server
